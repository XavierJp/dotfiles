# ============================================================================
# tmux.conf — minimal config, themed to match Ghostty/Neovim (TokyoNight Night)
# ============================================================================

# ── Prefix: C-a (easier than C-b, keeps C-a available via double-tap) ──────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── General ───────────────────────────────────────────────────────────────
set -g mouse on
set -g base-index 1                 # windows start at 1
setw -g pane-base-index 1           # panes start at 1
set -g renumber-windows on          # keep numbering gapless after closing
set -g history-limit 50000
set -g escape-time 10               # don't delay <Esc> in Neovim
set -g focus-events on              # let Neovim see focus gained/lost
set -g display-time 2000

# ── True color ────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm-ghostty:Tc"

# ── Splits: keep the current directory ────────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ── Pane navigation: vim-style ────────────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Copy mode: vi keys ────────────────────────────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ── Reload config ─────────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# ── Status bar (TokyoNight Night palette) ─────────────────────────────────
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#1a1b26,fg=#a9b1d6"
set -g status-left "#[bg=#7aa2f7,fg=#1a1b26,bold] #S #[default] "
set -g status-left-length 30
set -g status-right "#[fg=#565f89]#h "
set -g status-right-length 60

setw -g window-status-format "#[fg=#565f89] #I:#W "
setw -g window-status-current-format "#[fg=#7aa2f7,bold] #I:#W "

set -g pane-border-style "fg=#292e42"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style "bg=#7aa2f7,fg=#1a1b26"
