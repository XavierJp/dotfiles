# ============================================================================
# tmux.conf — deliberately minimal; rebuilt one binding at a time as needed.
#
# Host is cmux (Ghostty-based, macOS) reached over mosh. cmux owns C-b on the
# host, so the prefix here stays C-a — a C-b prefix would be swallowed on the
# Mac and never reach this session.
# ============================================================================

# ── Prefix: C-a (C-b belongs to cmux; double-tap sends a literal C-a) ──────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── Panes: a = side-by-side, C-z = stacked (both inherit the cwd) ─────────
# z is deliberately left unbound here so tmux's default zoom (resize-pane -Z)
# keeps working. C-z displaces the default suspend-client, still reachable via
# `C-a :suspend-client`.
bind a split-window -h -c "#{pane_current_path}"
bind C-z split-window -v -c "#{pane_current_path}"

# ── Mouse: click a pane to focus, drag a border to resize, scroll for history
set -g mouse on

# ── Invisible but essential ───────────────────────────────────────────────
set -g escape-time 10               # don't delay <Esc> in Neovim
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm-ghostty:Tc"

# ── System clipboard over mosh (OSC 52) ───────────────────────────────────
# mosh 1.4 relays only the "c" selector, so pin the sequence to it.
set -g set-clipboard on
set -ga terminal-overrides ",*:Ms=\\E]52;c;%p2%s\\7"

# ── Copy mode: vi keys (v selects, y yanks to the Mac clipboard) ───────────
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ── Reload config ─────────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# ── Status bar (TokyoNight Night palette) ─────────────────────────────────
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#1a1b26,fg=#a9b1d6"
set -g status-left "#[bg=#7aa2f7,fg=#1a1b26,bold] #S #[default] "
set -g status-left-length 30
set -g status-right "#[fg=#565f89]#h "
set -g status-right-length 60

setw -g window-status-format "#[fg=#565f89] #I:#W "
setw -g window-status-current-format "#[fg=#7aa2f7,bold] #I:#W "

set -g pane-border-style "fg=#292e42"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style "bg=#7aa2f7,fg=#1a1b26"
